<style>
:root{--bg:#ffeef4;--sky1:#9fdcff;--sky2:#ffe6f0;--ground:#e8cfa5;--grass:#8fd08a;--pipe:#6cc66f;--pipe2:#3f9a4f;--ink:#5a2236;--accent:#e0245e;--wing:#ffb3cf;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b1220;--sky1:#1c2a4a;--sky2:#4a2a4f;--ground:#5a4a3a;--grass:#2f5a3a;--pipe:#3f8a54;--pipe2:#26603a;--ink:#ffdbe6;--accent:#ff6b9a;--wing:#ff9cc0;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1b1220;--sky1:#1c2a4a;--sky2:#4a2a4f;--ground:#5a4a3a;--grass:#2f5a3a;--pipe:#3f8a54;--pipe2:#26603a;--ink:#ffdbe6;--accent:#ff6b9a;--wing:#ff9cc0;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*{box-sizing:border-box}
body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:"Trebuchet MS",system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;touch-action:none;user-select:none;-webkit-user-select:none}
header{display:flex;justify-content:space-between;width:100%;max-width:480px;padding:10px 16px;font-weight:700;font-size:1.15rem}
#wrap{position:relative;flex:1;width:100%;max-width:480px;min-height:0;padding:0 10px 14px}
canvas{width:100%;height:100%;display:block;border-radius:22px;border:3px solid var(--accent)}
#ov{position:absolute;inset:0 10px 14px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:10px;padding:20px;border-radius:22px;background:color-mix(in srgb,var(--bg) 85%,transparent)}
#ov h1{margin:0;font-size:2.1rem}
#ov p{margin:0;max-width:320px;line-height:1.4}
#ov img{width:96px;height:96px;border-radius:50%;border:4px solid var(--accent);object-fit:cover}
button{font:inherit;font-weight:700;font-size:1.2rem;padding:12px 32px;border:0;border-radius:999px;background:var(--accent);color:#fff;cursor:pointer;box-shadow:0 4px 0 rgba(0,0,0,.2)}
button:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.2)}
</style>

let W,H,dpr,k,gnd,B,pipes,parts,score,best=0,state='ready',t=0,last=0,flap=0,shake=0,off=0;
try{best=+localStorage.getItem('flybird-best')||0}catch(e){}
function size(){const r=cv.getBoundingClientRect();dpr=window.devicePixelRatio||1;W=r.width;H=r.height;cv.width=W*dpr;cv.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);k=Math.max(.75,Math.min(1.2,H/560));gnd=H-64*k;if(!B)B={x:0,y:0,vy:0,r:24*k};B.x=W*.28;B.r=24*k;if(state==='ready')B.y=H*.45}
function hud(){$('sc').textContent='⭐ '+score;$('best').textContent='🏆 '+best}
function reset(){size();score=0;pipes=[];parts=[];B.y=H*.45;B.vy=0;off=0;hud()}
function begin(){reset();state='play';ov.style.display='none';doFlap()}
function doFlap(){B.vy=-7.4*k;flap=12;for(let i=0;i<3;i++)parts.push({x:B.x-B.r,y:B.y+6,vx:-1-Math.random()*1.5,vy:Math.random()*1.5,l:1,e:'🪶'})}
function die(){if(state!=='play')return;state='dead';shake=14;
 const nb=score>best;if(nb){best=score;try{localStorage.setItem('flybird-best',best)}catch(e){}}hud();
 setTimeout(()=>{ov.innerHTML='<img src="'+av.src+'" alt=""><h1>Oops! 💫</h1><p>You flew through <b>'+score+'</b> gaps!'+(nb&&score>0?'<br>🎉 New best!':'')+'</p><button id="go">Fly again</button>';ov.style.display='flex';$('go').onclick=begin},700)}
function loop(now){const dt=Math.min((now-last)/16.7,2.5);last=now;t+=dt;
 const gap=Math.max(150*k,H*.27),pw=62*k,sp=(2.5+Math.min(score*.07,1.6))*k;
 if(state==='ready'){B.y=H*.45+Math.sin(t*.08)*10;off+=sp*.6*dt}
 else if(state==='play'){
  B.vy+=.42*k*dt;B.y+=B.vy*dt;off+=sp*dt;
  const lp=pipes[pipes.length-1];
  if(!lp||lp.x<W-230*k-sp*20){const m=70*k;pipes.push({x:W+20,gy:m+gap/2+Math.random()*(gnd-m*2-gap),p:0})}
  for(const p of pipes){p.x-=sp*dt;
   if(!p.p&&p.x+pw<B.x-B.r){p.p=1;score++;hud();for(let i=0;i<4;i++)parts.push({x:B.x,y:B.y,vx:(Math.random()-.5)*3,vy:-Math.random()*3,l:1,e:'✨'})}
   const cx=Math.max(p.x,Math.min(B.x,p.x+pw));
   if(Math.abs(B.x-cx)<B.r*.85){if(B.y-B.r*.8<p.gy-gap/2||B.y+B.r*.8>p.gy+gap/2)die()}}
  pipes=pipes.filter(p=>p.x>-pw-20);
  if(B.y+B.r>gnd){B.y=gnd-B.r;die()}
  if(B.y<B.r*.3){B.y=B.r*.3;B.vy=0}
 } else if(state==='dead'){B.vy+=.5*k*dt;B.y=Math.min(B.y+B.vy*dt,gnd-B.r)}
 for(const p of parts){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=.08*dt;p.l-=.03*dt}parts=parts.filter(p=>p.l>0);
 if(flap>0)flap-=dt;
 draw(gap,pw);requestAnimationFrame(loop)}
function pillar(x,y1,y2,pw,g,capTop){
 ctx.fillStyle=g('--pipe');ctx.strokeStyle=g('--pipe2');ctx.lineWidth=3*k;
 const cw=pw+12*k,ch=24*k;
 ctx.beginPath();ctx.roundRect(x,y1,pw,y2-y1,6*k);ctx.fill();ctx.stroke();
 const cy=capTop?y2-ch:y1;ctx.beginPath();ctx.roundRect(x-6*k,cy,cw,ch,8*k);ctx.fill();ctx.stroke();
 ctx.fillStyle='rgba(255,255,255,.25)';ctx.fillRect(x+8*k,y1+(capTop?0:ch),7*k,(y2-y1)-ch)}
function draw(gap,pw){const st=getComputedStyle(document.documentElement),g=n=>st.getPropertyValue(n).trim();
 ctx.clearRect(0,0,W,H);ctx.save();
 if(shake>0){ctx.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);shake-=1}
 const sky=ctx.createLinearGradient(0,0,0,gnd);sky.addColorStop(0,g('--sky1'));sky.addColorStop(1,g('--sky2'));ctx.fillStyle=sky;ctx.fillRect(-10,-10,W+20,H+20);
 ctx.textAlign='center';ctx.textBaseline='middle';ctx.globalAlpha=.85;ctx.font=(38*k)+'px serif';
 for(let i=0;i<4;i++)ctx.fillText('☁️',((i*W/3-off*.25)%(W+120)+W+120)%(W+120)-40,60*k+(i%2)*70*k+i*20*k);
 ctx.globalAlpha=.5;ctx.font=(60*k)+'px serif';
 for(let i=0;i<5;i++)ctx.fillText('🌳',((i*150*k-off*.5)%(W+200)+W+200)%(W+200)-60,gnd-30*k);
 ctx.globalAlpha=1;
 for(const p of pipes){pillar(p.x,-10,p.gy-gap/2,pw,g,true);pillar(p.x,p.gy+gap/2,gnd,pw,g,false);
  ctx.font=(28*k)+'px serif';ctx.fillText('🌸',p.x+pw/2,p.gy-gap/2-10*k);ctx.fillText('🌼',p.x+pw/2,p.gy+gap/2+14*k)}
 ctx.fillStyle=g('--grass');ctx.fillRect(-10,gnd,W+20,14*k);
 ctx.fillStyle=g('--ground');ctx.fillRect(-10,gnd+14*k,W+20,H);
 ctx.fillStyle='rgba(0,0,0,.08)';for(let i=0;i<10;i++){const x=((i*80*k-off*1.6)%(W+80)+W+80)%(W+80)-20;ctx.fillRect(x,gnd+30*k+(i%3)*10*k,24*k,4*k)}
 // bird
 const tilt=state==='ready'?0:Math.max(-.45,Math.min(.9,B.vy*.07));
 ctx.save();ctx.translate(B.x,B.y);ctx.rotate(tilt);
 const wa=flap>0?-.9:Math.sin(t*.25)*.25;
 ctx.fillStyle=g('--wing');ctx.strokeStyle='rgba(0,0,0,.12)';ctx.lineWidth=2;
 for(const s of[-1,1]){ctx.save();ctx.translate(s*B.r*.95,B.r*.35);ctx.rotate(s*(.5+wa));ctx.beginPath();ctx.ellipse(s*B.r*.5,0,B.r*.95,B.r*.42,0,0,7);ctx.fill();ctx.stroke();ctx.restore()}
 ctx.fillStyle='#ffd24d';ctx.beginPath();ctx.moveTo(-5*k,B.r*.9);ctx.lineTo(5*k,B.r*.9);ctx.lineTo(0,B.r*1.45);ctx.closePath();ctx.fill();
 ctx.fillStyle=g('--wing');ctx.beginPath();ctx.ellipse(0,B.r*.75,B.r*.7,B.r*.5,0,0,7);ctx.fill();
 ctx.rotate(-tilt*.6);
 ctx.save();ctx.beginPath();ctx.arc(0,0,B.r,0,7);ctx.closePath();ctx.fillStyle='#fff';ctx.fill();ctx.clip();
 if(av.complete&&av.naturalWidth)ctx.drawImage(av,-B.r,-B.r,B.r*2,B.r*2);ctx.restore();
 ctx.lineWidth=3.5*k;ctx.strokeStyle=g('--accent');ctx.beginPath();ctx.arc(0,0,B.r,0,7);ctx.stroke();
 ctx.restore();
 for(const p of parts){ctx.globalAlpha=Math.max(p.l,0);ctx.font=(16*k)+'px serif';ctx.fillText(p.e,p.x,p.y)}
 ctx.globalAlpha=1;
 if(state!=='ready'){ctx.font='800 '+(46*k)+'px "Trebuchet MS",sans-serif';ctx.fillStyle='#fff';ctx.strokeStyle=g('--accent');ctx.lineWidth=6*k;ctx.lineJoin='round';ctx.strokeText(score,W/2,80*k);ctx.fillText(score,W/2,80*k)}
 ctx.restore()}
function input(){if(state==='play')doFlap()}
cv.addEventListener('pointerdown',e=>{e.preventDefault();input()});
addEventListener('keydown',e=>{if(e.code==='Space'||e.code==='ArrowUp'){e.preventDefault();if(!e.repeat){if(state==='play')input();else if(ov.style.display!=='none'||state==='dead')$('go')&&ov.style.display!=='none'&&$('go').click()}}});
addEventListener('resize',size);
$('go').onclick=begin;
size();reset();requestAnimationFrame(t0=>{last=t0;loop(t0)});
